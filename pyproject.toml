[project]
name = 'movie-recommender'
version = '0.1.0'
description = 'A personalized movie recommendation system'
requires-python = '>=3.11, <3.12'
dependencies =[
    'pandas',
    'numpy',
    'matplotlib',
    'seaborn',
    'scikit-learn',
    'ipykernel',
    'pytest',
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ['src']